version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: cron
    cronjob: 0 4 1 1,7 *
  groups:
    github-actions-updates:
      patterns:
      - '*'
- package-ecosystem: npm
  directory: /
  schedule:
    interval: cron
    cronjob: 0 4 1 1,7 *
  groups:
    npm-updates:
      patterns:
      - '*'
