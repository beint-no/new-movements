name: PR previews
on:
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Open pull request number to preview
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: preview-${{ github.event.pull_request.number || inputs.pull_request }}
  cancel-in-progress: true
jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
      sha: ${{ steps.pr.outputs.sha }}
      closed: ${{ steps.pr.outputs.closed }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pull_request }}
        run: |
          [[ "$PR" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" > pr.json
          test "$(jq -r '.head.repo.full_name' pr.json)" = "$GITHUB_REPOSITORY"
          {
            echo "pr=$PR"
            echo "sha=$(jq -r '.head.sha' pr.json)"
            echo "closed=$(jq -r '.state == "closed"' pr.json)"
          } >> "$GITHUB_OUTPUT"
  build:
    needs: metadata
    if: needs.metadata.outputs.closed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: newmovements
            config: sites/newmovements/wrangler.jsonc
            credential: "REAI_SITE_TOKEN"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: preview-tools
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci --no-fund
      - run: npm install --global --no-fund wrangler@4.149.0
      - run: npm run check
      - run: node ../preview-tools/.github/preview/preview.mjs build "$CONFIG" ../.preview
        env:
          CONFIG: ${{ matrix.config }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: preview-${{ matrix.site }}
          path: .preview/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  deploy-preview:
    name: PR preview (${{ matrix.site }})
    needs: [metadata, build]
    if: always() && needs.metadata.result == 'success' && (needs.metadata.outputs.closed == 'true' || needs.build.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      deployments: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: newmovements
            config: sites/newmovements/wrangler.jsonc
            credential: "REAI_SITE_TOKEN"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - run: npm install --global --no-fund wrangler@4.149.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.metadata.outputs.closed != 'true'
        with:
          name: preview-${{ matrix.site }}
          path: .preview/
      - name: Create, update or remove PR preview
        run: node .github/preview/preview.mjs "$COMMAND" "$CONFIG" .preview
        env:
          COMMAND: ${{ needs.metadata.outputs.closed == 'true' && 'cleanup' || 'deploy' }}
          CONFIG: ${{ matrix.config }}
          ARTIFACT_NAME: preview-${{ matrix.site }}
          PR_NUMBER: ${{ needs.metadata.outputs.pr }}
          PR_SHA: ${{ needs.metadata.outputs.sha }}
          SITE_CREDENTIAL_BINDING: ${{ matrix.credential }}
          GH_TOKEN: ${{ github.token }}
          WRANGLER_SEND_METRICS: 'false'
